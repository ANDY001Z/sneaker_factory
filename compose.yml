services:
  # 1. Servidor Web / Proxy Inverso (Nginx)
  web:
    image: nginx:alpine
    container_name: sneaker_web
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/html
      - ./frontend:/var/www/html/frontend
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      backend:
        condition: service_started
    networks:
      - frontend_net

  # 2. Servidor Backend (PHP-FPM)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sneaker_backend
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy # Espera a que PostgreSQL esté 100% listo
    networks:
      - frontend_net
      - backend_net

  # 3. Base de Datos (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: sneaker_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend_net

# Redes aisladas (la base de datos no se expone hacia afuera)
networks:
  frontend_net:
  backend_net:

# Volumen persistente para la base de datos
volumes:
  postgres_data:
