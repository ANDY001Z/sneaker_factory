services:
  # 1. Servidor Web / Proxy Inverso (Nginx)
  web:
    image: nginx:1.27-alpine
    container_name: sneaker_web
    restart: unless-stopped          # se recupera tras reinicio del servidor o caída; respeta un "stop" manual
    ports:
      - "${PORT:-8081}:80"
      - "8443:443"
    volumes:
      - ./backend:/var/www/html:ro
      - ./frontend:/var/www/frontend:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./logs/nginx:/var/log/nginx   # logs de acceso y error persistentes en el host
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - frontend_net

  # 2. Servidor Backend (PHP-FPM)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: sneaker-backend:1.0
    container_name: sneaker_backend
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$s=@fsockopen(\"127.0.0.1\",9000); exit($$s?0:1);'"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - frontend_net
      - backend_net

  # 3. Base de Datos (PostgreSQL)  -> sin puertos publicados
  db:
    image: postgres:15-alpine
    container_name: sneaker_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend_net

networks:
  frontend_net:
  backend_net:
    internal: true      # sin salida a internet; solo backend <-> db

volumes:
  postgres_data:
