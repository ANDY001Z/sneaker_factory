version: '3.8'

services:
  # 1. Servidor Web / Proxy Inverso (Nginx)
  web:
    image: nginx:alpine
    container_name: sneaker_web
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      backend:
        condition: service_started
    networks:
      - frontend_net

  # 2. Servidor Backend (PHP-FPM)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sneaker_backend
    environment:
      # Le pasamos las credenciales al contenedor PHP
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./backend:/var/www/html
    networks:
      - frontend_net
      - backend_net

  # 3. Base de Datos (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: sneaker_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data:/docker-entrypoint-initdb.d
    networks:
      - backend_net

networks:
  frontend_net:
  backend_net:

volumes:
  postgres_data: