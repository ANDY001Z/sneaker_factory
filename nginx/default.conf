server {
    listen 80;
    server_name localhost;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 1. La raíz principal de la web es la carpeta frontend
    root /var/www/frontend;
    index index.html index.php;

    # 2. Endpoints de la API (redireccionan al enrutador index.php del backend)
    location ~ ^/(health|productos)$ {
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;
    }

    # 3. Al entrar a https://localhost:8443/ se sirve index.html de /var/www/frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 4. Las llamadas a scripts .php directos se procesan desde la carpeta backend
    location ~ \.php$ {
        root /var/www/html;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        include fastcgi_params;
    }
}