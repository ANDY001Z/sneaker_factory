# Formato de log con marca temporal ISO 8601
log_format sf '$remote_addr [$time_iso8601] "$request" $status $body_bytes_sent "$http_user_agent" rt=$request_time';

server_tokens off;

#  HTTP: solo redirige a HTTPS (y expone un check interno)
server {
    listen 80;
    server_name localhost sneaker.local;

    access_log /dev/stdout sf;
    access_log /var/log/nginx/access.log sf;
    error_log  /dev/stderr warn;
    error_log  /var/log/nginx/error.log warn;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host:8443$request_uri;
    }
}

# ---- HTTPS ----
server {
    listen 443 ssl;
    server_name localhost sneaker.local;

    access_log /dev/stdout sf;
    access_log /var/log/nginx/access.log sf;
    error_log  /dev/stderr warn;
    error_log  /var/log/nginx/error.log warn;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/frontend;
    index index.html;

    # API: todo pasa por el enrutador index.php
    location ~ ^/(health|productos)$ {
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;
    }

    # Healthcheck directo 
    location = /health.php {
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/health.php;
        include fastcgi_params;
    }

    # Cualquier otro .php queda bloqueado 
    location ~ \.php$ {
        return 404;
    }

    # Estaticos con cache corta
    location ~* \.(css|js|jpg|jpeg|png|svg|ico|webp)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}